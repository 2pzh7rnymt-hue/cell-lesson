it.push({l:1,x,y:y+.9,z,x2:x-.3,y2:y+1.4,z2:z,c:'#2f9e44',w:.1});it.push({l:1,x,y:y+.9,z,x2:x+.3,y2:y+1.4,z2:z,c:'#2f9e44',w:.1});

/* ================= 2, 4, 5, 6. Транспорт частиц ================= */
function sim(st,key){const sc=SC[key];
st.insertAdjacentHTML('beforeend','<div class="card"><p class="pill">'+sc.ar+'</p><canvas id="cv" role="img" aria-label="3D-анимация переноса частиц через мембрану"></canvas><small>Потяните сцену, чтобы повернуть. Схема, не реальный масштаб.</small><p id="cn"></p><p>'+sc.x+'</p></div>');
const PR={o:.4,k:.44,g:.5,w:.36,s:.8,n:.46,h:.34},zo=y=>y>2.35?0:y<-2.35?2:1,d2=(a,b)=>(a.x-b.x)**2+(a.z-b.z)**2,P=[];

{h:[blob(.7,2.7,.85,125,j+9,{flare:.1,r:.34}),blob(.7,2.7,.85,125,j+10,{flare:.1,r:.34})],off:.7,c:k=='cy'?'#d9541e':'#b44fd6',hole:1.55};
const G=sc.g.map(([k,gx,v,a,atp],j)=>({k,x:(gx-320)/55*(sc.g.length>2?1.45:1.25),z:0,v,a,atp,f:0,st:0,s:0,m:mk(k,j*3)}));

const fire=g=>{g.f=100;g.st=1-g.st;g.v.forEach(([s,n,a,b])=>P.filter(p=>p.s==s&&!p.w&&zo(p.y)==(a?2:0)).sort((u,v)=>d2(g,u)-d2(g,v)).slice(0,n).forEach((p,j)=>p.w={f:-j*18,a:[p.x,p.y,p.z],v:[g.x,0,g.z],b:[g.x+(j-1)*1.1,b?-4.3:4.3,g.z+(a?.9:-.9)]}))};

p.vx+=rn()*.01;p.vy+=rn()*.01;p.vz+=rn()*.01;const m=Math.hypot(p.vx,p.vy,p.vz);if(m>.1){p.vx*=.1/m;p.vy*=.1/m;p.vz*=.1/m}

if(zo(ny)==1&&zo(p.y)!=1&&!ok(p)){p.vy*=-1;ny=p.y}
p.x=nx;p.y=ny;p.z=nz;
if(zo(ny)==1&&p.s!='o'){const g=nr(p);if(g){p.x+=(g.x-p.x)*.15;p.z+=(g.z-p.z)*.15}}}}

M.h.forEach((B,i)=>put(it,B,g.x,0,g.z,col,null,pump?{dx:i?M.off:-M.off,sg:i?1:-1,sep}:{dx:i?M.off:-M.off}));
core(it,g.x,g.z,2.7,pump?y=>Math.max(0,sep(y)-.04):()=>g.k=='aq'?.14:.2,null);
it.push({t:1,x:g.x,y:3.4,z:g.z,txt:g.a,dx:0,dy:-6,c:'#0f172a'});
if(g.atp){if(g.f>0){const q=1-g.f/100;it.push({x:g.x+.5,y:-3.6,z:.3,r:.34,c:'#fb923c',txt:'АДФ'});it.push({x:g.x-.7-q*.6,y:-3.6-q*1.2,z:.5,r:.27,c:'#ec4899',txt:'Фн'});it.push({t:1,x:g.x,y:5.1,z:g.z,txt:'АТФ → АДФ + Фн',dx:0,dy:-6,c:'#b91c1c'})}
else it.push({x:g.x+.1,y:-3.7,z:.4,r:.44,c:'#facc15',txt:'АТФ',tc:'#422006'})}}
for(const p of P)it.push({x:p.x,y:p.y,z:p.z,r:PR[p.s],c:SP[p.s][0],txt:SP[p.s][1],tc:SP[p.s][2]});

},{auto:[-.25,.4],lim:1,fix:FX})}
